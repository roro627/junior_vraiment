name: End-to-end

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
      PLAYWRIGHT_EXPECT_PUBLIC_INDEXING: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Require the production URL
        run: test -n "$PLAYWRIGHT_BASE_URL"
      - run: pnpm exec playwright test
      - name: Lighthouse production budgets
        run: |
          origin="${PLAYWRIGHT_BASE_URL%/}"
          pnpm exec lhci autorun \
            --collect.startServerCommand="" \
            --collect.url="$origin/" \
            --collect.url="$origin/explorer" \
            --collect.url="$origin/methodologie"
