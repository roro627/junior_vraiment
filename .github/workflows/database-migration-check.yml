name: Database migration check

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "drizzle*.config.ts"
      - "src/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database-migration-check.yml"
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "drizzle*.config.ts"
      - "src/db/**"

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - run: pnpm vitest run src/db/schema/migration.schema.test.ts
